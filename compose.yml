services:
  postgres:
    image: postgres:17-alpine
    container_name: bunge-hub-postgres
    environment:
      POSTGRES_DB: odnelazm
      POSTGRES_USER: odnelazm
      POSTGRES_PASSWORD: odnelazm
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odnelazm -d odnelazm"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  postgres-data:
